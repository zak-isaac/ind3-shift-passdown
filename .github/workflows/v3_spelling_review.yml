name: V3 spelling and attribution review

on:
  pull_request:
    paths:
      - 'v3_*.py'
      - 'run_server.py'
      - 'static/v3.js'
      - 'templates/v3/**'
      - 'tests/**'
      - '.github/workflows/v3_spelling_review.yml'
  push:
    branches:
      - v3-spelling-and-acceptance-20261025

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Verify spelling, ownership, and route regressions
        run: |
          python -m pytest -q tests/test_v3_live_clock.py tests/test_v3_ollama_background.py tests/test_v3_remark_writer.py tests/test_v3_report_format.py tests/test_v3_dictionary_safety.py tests/test_v3_spelling_and_acceptance.py tests/test_v3_split.py tests/test_v3_operational_patch.py tests/test_v3_all_non_pm.py tests/test_v3_routes.py tests/test_v3_migration.py tests/test_v3_only.py
