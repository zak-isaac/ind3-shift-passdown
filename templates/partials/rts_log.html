{% if rts_units %}
  {% for unit in rts_units %}
  <div class="flex items-center gap-2 bg-green-50 border border-green-200 rounded-lg px-3 py-2">
    <span class="text-green-600 text-sm flex-shrink-0">&#10003;</span>
    <span class="font-bold text-sm text-green-800 flex-1">{{ unit }}</span>
    <span class="text-xs text-green-600 mr-2">returned to service</span>
    <button
      type="button"
      hx-delete="/lead/rts-log/{{ unit | urlencode }}"
      hx-target="#rts-log-content"
      hx-swap="innerHTML"
      hx-confirm="Remove {{ unit }} from the RTS log?"
      title="Undo — remove from RTS log"
      class="text-xs text-gray-400 hover:text-red-600 font-bold px-1.5 py-0.5
             rounded hover:bg-red-50 transition flex-shrink-0">
      &#10005;
    </button>
  </div>
  {% endfor %}
{% else %}
  <p class="text-xs text-gray-400 italic" id="rts-empty-hint">
    None yet &mdash; click <strong>&#10005; RTS</strong> on any OOS unit below and it will appear here instantly.
  </p>
{% endif %}
