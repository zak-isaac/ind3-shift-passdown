<!-- Email Preview Modal — loaded via HTMX into #email-modal-wrap -->
<dialog id="email-modal" style="width:min(760px,95vw);max-height:90vh;border-radius:12px;
  border:none;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;"
  open>

  <!-- Header bar -->
  <div style="background:#0053e2;color:#fff;padding:14px 20px;display:flex;
    align-items:center;justify-content:space-between;gap:12px;">
    <div>
      <p style="margin:0;font-weight:800;font-size:15px;">&#9993; Send Passdown Email</p>
      <p style="margin:2px 0 0;font-size:12px;opacity:.8;">Review before sending — you can edit if needed</p>
    </div>
    <button onclick="closeEmailModal()"
      style="background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;
             width:32px;height:32px;border-radius:50%;cursor:pointer;line-height:1;">&#10005;</button>
  </div>

  <!-- Subject bar -->
  <div style="padding:10px 20px;background:#f8faff;border-bottom:1px solid #e5e7eb;">
    <label style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;">Subject</label>
    <input id="email-subject" value="{{ subject | e }}"
      style="display:block;width:100%;margin-top:4px;padding:6px 10px;border:1px solid #d1d5db;
             border-radius:8px;font-size:13px;box-sizing:border-box;" />
  </div>

  <!-- Toggle bar -->
  <div style="padding:8px 20px;background:#f8faff;border-bottom:1px solid #e5e7eb;
    display:flex;gap:8px;align-items:center;">
    <span style="font-size:12px;color:#6b7280;font-weight:600;">View:</span>
    <button onclick="emailShowPreview()" id="btn-preview-mode"
      style="font-size:11px;font-weight:700;padding:4px 12px;border-radius:6px;cursor:pointer;
             background:#0053e2;color:#fff;border:none;">Preview</button>
    <button onclick="emailShowEdit()" id="btn-edit-mode"
      style="font-size:11px;font-weight:700;padding:4px 12px;border-radius:6px;cursor:pointer;
             background:#fff;color:#374151;border:1px solid #d1d5db;">Edit HTML</button>
  </div>

  <!-- Preview pane (iframe) -->
  <div id="email-preview-pane" style="padding:12px 20px;overflow-y:auto;max-height:52vh;">
    <iframe id="email-iframe"
      style="width:100%;height:480px;border:1px solid #e5e7eb;border-radius:8px;"
      sandbox="allow-same-origin"></iframe>
  </div>

  <!-- Edit pane (textarea) -->
  <div id="email-edit-pane" style="padding:12px 20px;display:none;">
    <textarea id="email-body-edit"
      style="width:100%;height:400px;font-family:monospace;font-size:11px;
             border:1px solid #d1d5db;border-radius:8px;padding:10px;
             box-sizing:border-box;resize:vertical;">{{ html_body | e }}</textarea>
    <p style="margin:4px 0 0;font-size:11px;color:#9ca3af;">
      Editing the raw HTML. Switch back to Preview to see changes.
    </p>
  </div>

  <!-- Footer action bar -->
  <div style="padding:14px 20px;background:#f8faff;border-top:1px solid #e5e7eb;
    display:flex;justify-content:space-between;align-items:center;gap:12px;">
    <div id="email-send-result" style="font-size:13px;"></div>
    <div style="display:flex;gap:8px;">
      <button onclick="closeEmailModal()"
        style="padding:8px 18px;border:1px solid #d1d5db;border-radius:8px;
               background:#fff;font-weight:700;font-size:13px;cursor:pointer;">
        Cancel
      </button>
      <button id="email-send-btn" onclick="emailConfirmSend({{ report_id }})"
        style="padding:8px 22px;border:none;border-radius:8px;
               background:#0053e2;color:#fff;font-weight:700;font-size:13px;cursor:pointer;">
        &#128232; Send Email
      </button>
    </div>
  </div>
</dialog>

<script>
// Populate iframe with the initial HTML
(function() {
  const raw = {{ html_body | tojson }};
  const iframe = document.getElementById('email-iframe');
  iframe.srcdoc = raw;
})();

function closeEmailModal() {
  document.getElementById('email-modal').remove();
  document.getElementById('email-modal-wrap').innerHTML = '';
}

function emailShowPreview() {
  // Sync iframe with any edits
  const body = document.getElementById('email-body-edit').value;
  document.getElementById('email-iframe').srcdoc = body;
  document.getElementById('email-preview-pane').style.display = '';
  document.getElementById('email-edit-pane').style.display   = 'none';
  document.getElementById('btn-preview-mode').style.background = '#0053e2';
  document.getElementById('btn-preview-mode').style.color    = '#fff';
  document.getElementById('btn-preview-mode').style.border   = 'none';
  document.getElementById('btn-edit-mode').style.background  = '#fff';
  document.getElementById('btn-edit-mode').style.color       = '#374151';
  document.getElementById('btn-edit-mode').style.border      = '1px solid #d1d5db';
}

function emailShowEdit() {
  document.getElementById('email-preview-pane').style.display = 'none';
  document.getElementById('email-edit-pane').style.display    = '';
  document.getElementById('btn-edit-mode').style.background   = '#0053e2';
  document.getElementById('btn-edit-mode').style.color        = '#fff';
  document.getElementById('btn-edit-mode').style.border       = 'none';
  document.getElementById('btn-preview-mode').style.background= '#fff';
  document.getElementById('btn-preview-mode').style.color     = '#374151';
  document.getElementById('btn-preview-mode').style.border    = '1px solid #d1d5db';
}

function emailConfirmSend(reportId) {
  if (!confirm('Are you sure you want to send this passdown email?\n\nThis will deliver to all configured recipients.')) return;
  const btn     = document.getElementById('email-send-btn');
  const result  = document.getElementById('email-send-result');
  const subject = document.getElementById('email-subject').value;
  const body    = document.getElementById('email-body-edit').value;

  btn.disabled      = true;
  btn.textContent   = 'Sending…';
  result.innerHTML  = '<span style="color:#6b7280;">Sending via Outlook…</span>';

  const fd = new FormData();
  fd.append('subject',   subject);
  fd.append('html_body', body);

  fetch(`/report/${reportId}/send-email`, { method: 'POST', body: fd })
    .then(r => r.text())
    .then(html => {
      result.innerHTML   = html;
      btn.disabled       = false;
      btn.textContent    = '✓ Sent';
      btn.style.background = '#2a8703';
    })
    .catch(err => {
      result.innerHTML = `<span style="color:#c00;">Error: ${err}</span>`;
      btn.disabled     = false;
      btn.textContent  = '📨 Send Email';
    });
}
</script>
