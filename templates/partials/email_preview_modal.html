<!-- Email Preview Modal — loaded via HTMX into #email-modal-wrap -->

<!-- Backdrop -->
<div id="email-backdrop"
  onclick="closeEmailModal()"
  style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;"></div>

<!-- Modal — fixed, centered at current viewport -->
<div id="email-modal"
  style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
         width:min(780px,95vw);max-height:90vh;z-index:9999;
         border-radius:14px;overflow:hidden;
         box-shadow:0 24px 64px rgba(0,0,0,.4);
         display:flex;flex-direction:column;">

  <!-- Header -->
  <div style="background:#0053e2;color:#fff;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
    <div>
      <p style="margin:0;font-weight:800;font-size:15px;">&#9993; Send Passdown Email</p>
      <p style="margin:2px 0 0;font-size:12px;opacity:.8;">Review · edit if needed · then send</p>
    </div>
    <button onclick="closeEmailModal()"
      style="background:rgba(255,255,255,.18);border:none;color:#fff;font-size:18px;
             width:32px;height:32px;border-radius:50%;cursor:pointer;line-height:32px;">&#10005;</button>
  </div>

  <!-- Subject -->
  <div style="padding:10px 20px;background:#f8faff;border-bottom:1px solid #e5e7eb;flex-shrink:0;">
    <label style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;
                  display:block;margin-bottom:4px;">To</label>
    <p style="margin:0 0 8px;font-size:12px;color:#374151;" id="email-to-display">{{ email_to }}</p>
    <label style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;
                  display:block;margin-bottom:4px;">Subject</label>
    <input id="email-subject" value="{{ subject | e }}"
      style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:8px;
             font-size:13px;box-sizing:border-box;" />
  </div>

  <!-- Tab bar -->
  <div style="padding:8px 20px;background:#f8faff;border-bottom:1px solid #e5e7eb;
    display:flex;gap:8px;align-items:center;flex-shrink:0;">
    <button onclick="showTab('preview')" id="tab-preview"
      style="font-size:11px;font-weight:700;padding:5px 14px;border-radius:6px;cursor:pointer;
             background:#0053e2;color:#fff;border:none;">&#128065; Preview</button>
    <button onclick="showTab('edit')" id="tab-edit"
      style="font-size:11px;font-weight:700;padding:5px 14px;border-radius:6px;cursor:pointer;
             background:#fff;color:#374151;border:1px solid #d1d5db;">&#9998; Edit Text</button>
    <span style="font-size:11px;color:#9ca3af;margin-left:4px;">
      Edit strips formatting &mdash; switch back to preview when done
    </span>
  </div>

  <!-- Preview pane -->
  <div id="pane-preview" style="flex:1;overflow:hidden;padding:14px 20px;">
    <iframe id="email-iframe"
      style="width:100%;height:100%;border:1px solid #e5e7eb;border-radius:8px;"
      sandbox="allow-same-origin"></iframe>
  </div>

  <!-- Edit pane — plain text, not raw HTML -->
  <div id="pane-edit" style="flex:1;overflow:hidden;padding:14px 20px;display:none;">
    <div style="font-size:11px;color:#6b7280;margin-bottom:6px;">
      Plain text view — edit freely. Formatting is preserved in the sent email.
    </div>
    <textarea id="email-plain-edit"
      style="width:100%;height:calc(100% - 28px);font-family:Calibri,Arial,sans-serif;
             font-size:13px;line-height:1.7;border:1px solid #d1d5db;border-radius:8px;
             padding:12px;box-sizing:border-box;resize:none;color:#111;"></textarea>
  </div>

  <!-- Footer -->
  <div style="padding:12px 20px;background:#f8faff;border-top:1px solid #e5e7eb;
    display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
    <div id="email-send-result" style="font-size:13px;min-height:20px;"></div>
    <div style="display:flex;gap:8px;">
      <button onclick="closeEmailModal()"
        style="padding:8px 18px;border:1px solid #d1d5db;border-radius:8px;
               background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:#374151;">
        Cancel
      </button>
      <button id="email-send-btn" onclick="emailConfirmSend({{ report_id }})"
        style="padding:8px 22px;border:none;border-radius:8px;
               background:#0053e2;color:#fff;font-weight:700;font-size:13px;cursor:pointer;">
        &#128232; Send Email
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  // Store original HTML body and build plain text from it
  const _rawHtml = {{ html_body | tojson }};

  // Populate iframe
  document.getElementById('email-iframe').srcdoc = _rawHtml;

  // Strip HTML to plain text for the edit pane
  function htmlToPlain(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/p>/gi, '\n')
      .replace(/<\/li>/gi, '\n')
      .replace(/<\/tr>/gi, '\n')
      .replace(/<\/th>/gi, '\t')
      .replace(/<\/td>/gi, '\t')
      .replace(/<li[^>]*>/gi, '• ')
      .replace(/<[^>]+>/g, '');
    return tmp.textContent.replace(/\t\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  window._rawHtml    = _rawHtml;
  window._plainText  = htmlToPlain(_rawHtml);
  document.getElementById('email-plain-edit').value = window._plainText;
})();

function showTab(which) {
  const isPreview = which === 'preview';

  if (!isPreview) {
    // Sync plain text from any HTML edits (already stripped on first load)
    // nothing to sync — plain textarea is the editable source
  } else {
    // If user edited plain text, show note that HTML preview won't reflect changes
  }

  document.getElementById('pane-preview').style.display = isPreview ? '' : 'none';
  document.getElementById('pane-edit').style.display    = isPreview ? 'none' : '';

  const active   = { background:'#0053e2', color:'#fff', border:'none' };
  const inactive = { background:'#fff',    color:'#374151', border:'1px solid #d1d5db' };

  Object.assign(document.getElementById('tab-preview').style, isPreview ? active : inactive);
  Object.assign(document.getElementById('tab-edit').style,    isPreview ? inactive : active);
}

function closeEmailModal() {
  ['email-modal','email-backdrop'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.remove();
  });
  const wrap = document.getElementById('email-modal-wrap');
  if (wrap) wrap.innerHTML = '';
}

function emailConfirmSend(reportId) {
  if (!confirm('Send this passdown email to all configured recipients?\n\nThis cannot be undone.')) return;

  const btn    = document.getElementById('email-send-btn');
  const result = document.getElementById('email-send-result');
  const subj   = document.getElementById('email-subject').value;

  // If user edited plain text, wrap it simply; otherwise use original HTML
  const plainEdited = document.getElementById('email-plain-edit').value;
  const bodyToSend  = (plainEdited !== window._plainText)
    ? '<html><body style="font-family:Calibri,Arial,sans-serif;font-size:14px;color:#111;max-width:700px;line-height:1.6;">'
      + '<pre style="white-space:pre-wrap;font-family:inherit;font-size:inherit;">'
      + plainEdited.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      + '</pre></body></html>'
    : window._rawHtml;

  btn.disabled     = true;
  btn.textContent  = 'Sending…';
  result.innerHTML = '<span style="color:#6b7280;">Sending via Outlook…</span>';

  const fd = new FormData();
  fd.append('subject',   subj);
  fd.append('html_body', bodyToSend);

  fetch(`/report/${reportId}/send-email`, { method:'POST', body:fd })
    .then(r => r.text())
    .then(html => {
      result.innerHTML     = html;
      btn.textContent      = '✓ Sent';
      btn.style.background = '#2a8703';
    })
    .catch(err => {
      result.innerHTML = `<span style="color:#c00;">&#10060; ${err}</span>`;
      btn.disabled     = false;
      btn.textContent  = '📨 Send Email';
    });
}
</script>
