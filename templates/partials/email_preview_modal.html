<!-- Email Preview Modal — loaded via HTMX into #email-modal-wrap -->

<!-- Backdrop — light, not dark -->
<div id="email-backdrop"
  onclick="closeEmailModal()"
  style="position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:9998;"></div>

<!-- Modal -->
<div id="email-modal"
  style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
         width:min(860px,96vw);height:93vh;max-height:93vh;z-index:9999;
         border-radius:14px;overflow:hidden;background:#fff;
         box-shadow:0 20px 60px rgba(0,0,0,.28);
         display:flex;flex-direction:column;">

  <!-- Header -->
  <div style="background:#0053e2;color:#fff;padding:13px 20px;
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
    <div>
      <p style="margin:0;font-weight:800;font-size:15px;">&#9993; Send Passdown Email</p>
      <p style="margin:2px 0 0;font-size:11px;opacity:.8;">Preview · edit if needed · confirm · send</p>
    </div>
    <button onclick="closeEmailModal()"
      style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:17px;
             width:30px;height:30px;border-radius:50%;cursor:pointer;line-height:30px;">&#10005;</button>
  </div>

  <!-- To + Subject -->
  <div style="padding:10px 20px;background:#fff;border-bottom:1px solid #e5e7eb;flex-shrink:0;">
    <div style="display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;">
      <div style="min-width:0;">
        <span style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;">To</span>
        <p style="margin:2px 0 0;font-size:12px;color:#374151;">{{ email_to }}</p>
      </div>
      <div style="flex:1;min-width:220px;">
        <label style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;display:block;">Subject</label>
        <input id="email-subject" value="{{ subject | e }}"
          style="display:block;width:100%;margin-top:2px;padding:5px 10px;
                 border:1px solid #d1d5db;border-radius:7px;font-size:13px;
                 box-sizing:border-box;background:#fff;" />
      </div>
    </div>
  </div>

  <!-- Tab bar -->
  <div style="padding:7px 20px;background:#f8faff;border-bottom:1px solid #e5e7eb;
    display:flex;gap:8px;align-items:center;flex-shrink:0;">
    <button onclick="showTab('preview')" id="tab-preview"
      style="font-size:11px;font-weight:700;padding:5px 14px;border-radius:6px;cursor:pointer;
             background:#0053e2;color:#fff;border:none;">&#128065; Preview</button>
    <button onclick="showTab('edit')" id="tab-edit"
      style="font-size:11px;font-weight:700;padding:5px 14px;border-radius:6px;cursor:pointer;
             background:#fff;color:#374151;border:1px solid #d1d5db;">&#9998; Edit</button>
  </div>

  <!-- Preview pane -->
  <div id="pane-preview" style="flex:1 1 0;min-height:0;padding:0;">
    <iframe id="email-iframe"
      style="width:100%;height:100%;border:none;display:block;"
      sandbox="allow-same-origin"></iframe>
  </div>

  <!-- Edit pane — full HTML, no padding steal, white background -->
  <div id="pane-edit" style="flex:1 1 0;min-height:0;display:none;background:#fff;">
    <textarea id="email-html-edit"
      style="width:100%;height:100%;font-family:Consolas,'Courier New',monospace;
             font-size:12px;line-height:1.65;
             border:none;outline:none;padding:16px 20px;
             box-sizing:border-box;resize:none;
             color:#1e293b;background:#fff;display:block;"></textarea>
  </div>

  <!-- Footer -->
  <div style="padding:11px 20px;background:#fff;border-top:1px solid #e5e7eb;
    display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
    <div id="email-send-result" style="font-size:13px;min-height:20px;"></div>
    <div style="display:flex;gap:8px;">
      <button onclick="closeEmailModal()"
        style="padding:7px 18px;border:1px solid #d1d5db;border-radius:8px;
               background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:#374151;">
        Cancel
      </button>
      <button id="email-send-btn" onclick="emailConfirmSend({{ report_id }})"
        style="padding:7px 22px;border:none;border-radius:8px;
               background:#0053e2;color:#fff;font-weight:700;font-size:13px;cursor:pointer;">
        &#128232; Send Email
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  const raw = {{ html_body | tojson }};
  window._rawHtml = raw;

  // Iframe preview
  document.getElementById('email-iframe').srcdoc = raw;

  // Edit pane — shows HTML source (easy to read, easy to edit)
  document.getElementById('email-html-edit').value = raw;
})();

function showTab(which) {
  const isPreview = which === 'preview';

  // If switching back to preview, sync iframe with any edits
  if (isPreview) {
    document.getElementById('email-iframe').srcdoc =
      document.getElementById('email-html-edit').value;
  }

  document.getElementById('pane-preview').style.display = isPreview ? '' : 'none';
  document.getElementById('pane-edit').style.display    = isPreview ? 'none' : '';

  const active   = { background:'#0053e2', color:'#fff',     border:'none' };
  const inactive = { background:'#fff',    color:'#374151',  border:'1px solid #d1d5db' };
  Object.assign(document.getElementById('tab-preview').style, isPreview ? active : inactive);
  Object.assign(document.getElementById('tab-edit').style,    isPreview ? inactive : active);
}

function closeEmailModal() {
  ['email-modal', 'email-backdrop'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.remove();
  });
  const wrap = document.getElementById('email-modal-wrap');
  if (wrap) wrap.innerHTML = '';
}

function emailConfirmSend(reportId) {
  if (!confirm('Send this passdown email to all configured recipients?\n\nThis cannot be undone.')) return;

  const btn    = document.getElementById('email-send-btn');
  const result = document.getElementById('email-send-result');
  const subj   = document.getElementById('email-subject').value;
  // Always use the HTML from the edit box (synced with any edits)
  const body   = document.getElementById('email-html-edit').value;

  btn.disabled     = true;
  btn.textContent  = 'Sending…';
  result.innerHTML = '<span style="color:#6b7280;">Sending via Outlook…</span>';

  const fd = new FormData();
  fd.append('subject',   subj);
  fd.append('html_body', body);

  fetch(`/report/${reportId}/send-email`, { method: 'POST', body: fd })
    .then(r => r.text())
    .then(html => {
      result.innerHTML     = html;
      btn.textContent      = '✓ Sent';
      btn.style.background = '#2a8703';
    })
    .catch(err => {
      result.innerHTML = `<span style="color:#c00;">&#10060; ${err}</span>`;
      btn.disabled     = false;
      btn.textContent  = '📨 Send Email';
    });
}
</script>
