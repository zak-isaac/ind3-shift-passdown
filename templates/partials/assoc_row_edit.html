<!-- partials/assoc_row_edit.html — single roster row (inline edit mode) -->
<tr id="assoc-row-{{ a.assoc_num }}" class="bg-blue-50 border-b border-blue-200">
  <td colspan="6" class="px-3 py-3">
    <form
      hx-post="/admin/associates/{{ a.assoc_num }}/edit"
      hx-target="#assoc-table"
      hx-swap="innerHTML"
      class="flex flex-wrap items-end gap-3">

      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Associate #</label>
        <input name="new_assoc_num" type="text" value="{{ a.assoc_num }}" required
          class="rounded-lg border border-gray-300 px-2.5 py-1.5 text-sm font-mono w-28
                 focus:border-wm-blue outline-none transition" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Full Name</label>
        <input name="full_name" type="text" value="{{ a.full_name | title }}" required
          class="rounded-lg border border-gray-300 px-2.5 py-1.5 text-sm w-48
                 focus:border-wm-blue outline-none transition" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Shift</label>
        <select name="shift"
          class="rounded-lg border border-gray-300 px-2.5 py-1.5 text-sm
                 focus:border-wm-blue outline-none transition">
          <option value="" {% if not a.shift %}selected{% endif %}>&mdash; Any &mdash;</option>
          {% for s in ['S1','S2','S3','S4','S5'] %}
          <option value="{{ s }}" {% if a.shift == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>

      <label class="flex items-center gap-2 cursor-pointer select-none pb-1.5">
        <input type="checkbox" name="is_mst" value="1" {% if a.is_mst %}checked{% endif %}
          class="w-4 h-4 accent-wm-blue rounded" />
        <span class="text-xs font-semibold text-gray-700">&#128202; MST</span>
      </label>

      <div class="flex gap-2 ml-auto">
        <button type="submit"
          class="bg-wm-blue hover:bg-blue-700 text-white font-bold text-xs px-4 py-1.5 rounded-lg transition">
          &#10003; Save
        </button>
        <button type="button"
          hx-get="/admin/associates/{{ a.assoc_num }}/edit-form/cancel"
          hx-target="#assoc-row-{{ a.assoc_num }}"
          hx-swap="outerHTML"
          class="text-gray-500 text-xs font-bold px-4 py-1.5 rounded-lg border border-gray-300 hover:bg-gray-100 transition">
          &#10005; Cancel
        </button>
      </div>
    </form>
  </td>
</tr>
