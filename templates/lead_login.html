<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MST Access – IND3 Shift Passdown</title>
  <link rel="stylesheet" href="/static/tailwind.min.css">
  <style>
    :root {
      --wm-blue:  #0053e2;
      --wm-dark:  #001e50;
      --wm-spark: #ffc220;
    }

    .hero-bg {
      background-color: var(--wm-dark);
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(0,83,226,.08) 0px,
          rgba(0,83,226,.08) 2px,
          transparent       2px,
          transparent       18px
        );
    }

    @keyframes scan {
      0%   { top: -4px; }
      100% { top: 100%; }
    }
    .scanline::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 4px;
      background: linear-gradient(to bottom, transparent, rgba(255,194,32,.25), transparent);
      animation: scan 5s linear infinite;
      pointer-events: none;
    }

    input.pin-input:focus {
      box-shadow: 0 0 0 4px rgba(255,194,32,.35), 0 0 20px rgba(0,83,226,.25);
    }

    .btn-submitting { pointer-events: none; opacity: .8; }
  </style>
</head>

<body class="hero-bg min-h-screen flex flex-col scanline relative overflow-hidden">

  <!-- ── TOP NAV — identical to tech login ─────────────────────────────── -->
  <header class="bg-wm-dark border-b border-blue-900 shadow-lg" style="border-color:#0053e2; border-bottom-width:2px;">
    <div class="w-full px-5 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <svg width="32" height="32" viewBox="0 0 40 40" fill="none" aria-label="Walmart spark">
          <path d="M20 2 L22.4 14.8 L32.7 7.3 L25.2 17.6 L38 20 L25.2 22.4 L32.7 32.7 L22.4 25.2 L20 38 L17.6 25.2 L7.3 32.7 L14.8 22.4 L2 20 L14.8 17.6 L7.3 7.3 L17.6 14.8 Z" fill="#ffc220"/>
        </svg>
        <span class="text-white font-black text-lg tracking-widest uppercase">Walmart</span>
        <div class="w-px h-5 bg-blue-700 mx-1"></div>
        <span class="text-blue-300 text-sm font-medium tracking-wide">IND3 Maintenance</span>
      </div>
      <span class="text-wm-spark text-xs font-black font-mono bg-wm-blue bg-opacity-30 px-3 py-1 rounded-full border border-wm-spark border-opacity-30">
        {{ dc_number }}
      </span>
    </div>
  </header>

  <!-- ── MAIN ───────────────────────────────────────────────────────────── -->
  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="flex flex-col gap-5" style="width:90%;">

      <!-- LOGIN CARD — identical structure to tech login -->
      <div class="bg-white rounded-2xl overflow-hidden shadow-2xl" style="box-shadow: 0 0 40px rgba(0,83,226,.3), 0 20px 60px rgba(0,0,0,.5);">

        <!-- Card header — MST manager illustration -->
        <div class="relative bg-wm-dark overflow-hidden" style="padding: 2rem 2rem 0;">

          <!-- Background warehouse-rack pattern — identical to tech login -->
          <div class="absolute inset-0 opacity-10" aria-hidden="true">
            <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
              <line x1="0"   y1="100%" x2="100%" y2="100%" stroke="#ffc220" stroke-width="2"/>
              <line x1="0"   y1="75%"  x2="100%" y2="75%"  stroke="#0053e2" stroke-width="1"/>
              <line x1="0"   y1="50%"  x2="100%" y2="50%"  stroke="#0053e2" stroke-width="1"/>
              <line x1="20%" y1="0"    x2="20%"  y2="100%" stroke="#0053e2" stroke-width="1"/>
              <line x1="50%" y1="0"    x2="50%"  y2="100%" stroke="#0053e2" stroke-width="1"/>
              <line x1="80%" y1="0"    x2="80%"  y2="100%" stroke="#0053e2" stroke-width="1"/>
            </svg>
          </div>

          <!-- MST manager SVG — same canvas (220×180), same shelving -->
          <div class="flex justify-center relative z-10 pb-0">
            <svg width="220" height="180" viewBox="0 0 220 180" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="MST lead manager">

              <ellipse cx="110" cy="175" rx="60" ry="6" fill="rgba(0,0,0,.35)"/>

              <!-- Left rack (identical to tech) -->
              <rect x="8"  y="60"  width="6"  height="115" fill="#0d3b8c" rx="2"/>
              <rect x="8"  y="60"  width="55" height="5"   fill="#0d3b8c" rx="1"/>
              <rect x="8"  y="90"  width="55" height="4"   fill="#0d3b8c" rx="1"/>
              <rect x="8"  y="120" width="55" height="4"   fill="#0d3b8c" rx="1"/>
              <rect x="57" y="60"  width="6"  height="115" fill="#0d3b8c" rx="2"/>
              <rect x="12" y="65"  width="16" height="20"  fill="#1a4fc4" rx="2"/>
              <rect x="31" y="65"  width="28" height="20"  fill="#0a2d80" rx="2"/>
              <rect x="12" y="95"  width="44" height="20"  fill="#1a4fc4" rx="2"/>
              <rect x="12" y="125" width="24" height="14"  fill="#0a2d80" rx="2"/>
              <rect x="39" y="125" width="18" height="14"  fill="#1a4fc4" rx="2"/>

              <!-- Right rack (identical to tech) -->
              <rect x="156" y="60"  width="6"  height="115" fill="#0d3b8c" rx="2"/>
              <rect x="156" y="60"  width="56" height="5"   fill="#0d3b8c" rx="1"/>
              <rect x="156" y="90"  width="56" height="4"   fill="#0d3b8c" rx="1"/>
              <rect x="156" y="120" width="56" height="4"   fill="#0d3b8c" rx="1"/>
              <rect x="206" y="60"  width="6"  height="115" fill="#0d3b8c" rx="2"/>
              <rect x="160" y="65"  width="20" height="20"  fill="#1a4fc4" rx="2"/>
              <rect x="183" y="65"  width="25" height="20"  fill="#0a2d80" rx="2"/>
              <rect x="160" y="95"  width="48" height="20"  fill="#1a4fc4" rx="2"/>
              <rect x="160" y="125" width="30" height="14"  fill="#0a2d80" rx="2"/>
              <rect x="193" y="125" width="15" height="14"  fill="#1a4fc4" rx="2"/>

              <!-- MANAGER PERSON — dark navy uniform instead of hi-vis blue -->
              <!-- Legs -->
              <rect x="97"  y="135" width="10" height="38" fill="#0d2444" rx="4"/>
              <rect x="113" y="135" width="10" height="38" fill="#0d2444" rx="4"/>
              <!-- Boots -->
              <rect x="93"  y="163" width="16" height="9"  fill="#111" rx="3"/>
              <rect x="111" y="163" width="16" height="9"  fill="#111" rx="3"/>

              <!-- Body — dark navy (manager uniform) -->
              <rect x="90" y="90" width="40" height="48" fill="#001e50" rx="6"/>
              <!-- Gold epaulette stripe -->
              <rect x="90" y="95" width="40" height="4"  fill="#ffc220" rx="1" opacity=".9"/>
              <!-- Name badge -->
              <rect x="94" y="103" width="14" height="9"  fill="#ffc220" rx="2"/>
              <rect x="96" y="106" width="10" height="1.5" fill="#001e50" rx="1"/>
              <rect x="96" y="109" width="7"  height="1.5" fill="#001e50" rx="1"/>
              <!-- Right chest pocket -->
              <rect x="113" y="102" width="12" height="14" fill="#0a1a3e" rx="2"/>
              <rect x="117" y="100" width="2"  height="5"  fill="#ffc220" rx="1"/>

              <!-- Left arm holding tablet -->
              <rect x="68" y="93" width="22" height="10" fill="#001e50" rx="5" transform="rotate(10 68 93)"/>
              <!-- Tablet body -->
              <rect x="42" y="76" width="32" height="40" fill="#1a2744" rx="4"/>
              <rect x="44" y="78" width="28" height="32" fill="#0d1f3c" rx="3"/>
              <!-- Screen content -->
              <rect x="46" y="80" width="24" height="3"  fill="#ffc220" rx="1" opacity=".8"/>
              <rect x="46" y="85" width="18" height="2"  fill="#7fa8e8" rx="1"/>
              <rect x="46" y="89" width="22" height="2"  fill="#7fa8e8" rx="1"/>
              <rect x="46" y="93" width="14" height="2"  fill="#7fa8e8" rx="1"/>
              <rect x="46" y="97" width="20" height="2"  fill="#ffc220" rx="1" opacity=".5"/>
              <circle cx="58" cy="111" r="3" fill="#2a3f6f" stroke="#3a5090" stroke-width="1"/>

              <!-- Right arm holding radio -->
              <rect x="130" y="95" width="22" height="10" fill="#001e50" rx="5" transform="rotate(-15 130 95)"/>
              <!-- Radio -->
              <rect x="150" y="72" width="14" height="34" fill="#111" rx="4"/>
              <rect x="159" y="58" width="3"  height="18" fill="#333" rx="1.5"/>
              <rect x="152" y="76" width="10" height="6"  fill="#222" rx="2"/>
              <line x1="153" y1="77.5" x2="161" y2="77.5" stroke="#444" stroke-width=".7"/>
              <line x1="153" y1="79.5" x2="161" y2="79.5" stroke="#444" stroke-width=".7"/>
              <line x1="153" y1="81.5" x2="161" y2="81.5" stroke="#444" stroke-width=".7"/>
              <circle cx="157" cy="86" r="2" fill="#00ff88" opacity=".9">
                <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.4s" repeatCount="indefinite"/>
              </circle>
              <rect x="152" y="90"  width="10" height="3" fill="#0053e2" rx="1.5"/>
              <rect x="152" y="95"  width="10" height="3" fill="#333"    rx="1.5"/>
              <rect x="152" y="100" width="10" height="3" fill="#333"    rx="1.5"/>

              <!-- Neck -->
              <rect x="104" y="78" width="12" height="14" fill="#c9956b" rx="4"/>

              <!-- Head -->
              <ellipse cx="110" cy="68" rx="18" ry="16" fill="#d4a27a"/>
              <circle cx="104" cy="66" r="2" fill="#6b4226"/>
              <circle cx="116" cy="66" r="2" fill="#6b4226"/>
              <path d="M 105 73 Q 110 77 115 73" stroke="#6b4226" stroke-width="1.5" fill="none" stroke-linecap="round"/>

              <!-- Dark navy hard hat (manager) -->
              <ellipse cx="110" cy="54" rx="22" ry="8"  fill="#001e50"/>
              <rect    x="90"  y="52" width="40" height="10" fill="#001e50" rx="3"/>
              <rect    x="88"  y="58" width="44" height="5"  fill="#0a1428" rx="2"/>
              <ellipse cx="110" cy="63" rx="25" ry="4"  fill="#0a1428"/>
              <!-- Spark on hat -->
              <path d="M110 50 L111.2 54.4 L115.2 51.9 L112.7 55.9 L117.1 57.1 L112.7 58.3 L115.2 62.3 L111.2 59.8 L110 64.2 L108.8 59.8 L104.8 62.3 L107.3 58.3 L102.9 57.1 L107.3 55.9 L104.8 51.9 L108.8 54.4 Z" fill="#ffc220" opacity=".9"/>

              <line x1="0" y1="172" x2="220" y2="172" stroke="#0d3b8c" stroke-width="2" opacity=".5"/>

              <!-- Floating sparks — identical to tech login -->
              <circle cx="75"  cy="40" r="3" fill="#ffc220" opacity=".7">
                <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s"   repeatCount="indefinite"/>
                <animate attributeName="cy"      values="40;32;40"    dur="2s"   repeatCount="indefinite"/>
              </circle>
              <circle cx="148" cy="30" r="2" fill="#ffc220" opacity=".5">
                <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.6s" repeatCount="indefinite"/>
                <animate attributeName="cy"      values="30;22;30"    dur="1.6s" repeatCount="indefinite"/>
              </circle>
              <circle cx="60"  cy="20" r="2" fill="#0053e2" opacity=".7">
                <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" repeatCount="indefinite"/>
              </circle>
            </svg>
          </div>

          <!-- Headline — same layout as tech card header -->
          <div class="text-center pb-4 relative z-10">
            <h1 class="text-white font-black text-2xl tracking-tight leading-none">MST Dashboard</h1>
            <p class="text-blue-300 text-sm mt-1">Enter your associate ID to access the dashboard</p>
          </div>
        </div><!-- /card header -->

        <!-- Card body — identical layout to tech login, PIN input swap -->
        <div class="p-6 flex flex-col gap-5 bg-white">

          {% if error %}
          <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm font-semibold flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd"/></svg>
            {{ error }}
          </div>
          {% endif %}

          <form method="POST" action="/lead/login" class="flex flex-col gap-4" autocomplete="off" id="loginForm">
            <input type="hidden" name="next" value="{{ next }}"/>

            <div class="flex flex-col gap-2">
              <label class="text-xs font-black text-gray-500 uppercase tracking-widest">Associate ID</label>
              <div class="relative">
                <!-- ID badge icon -->
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2"/>
                  </svg>
                </span>
                <input
                  name="pin"
                  id="pinInput"
                  type="password"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;"
                  maxlength="10"
                  autofocus
                  required
                  class="pin-input w-full pl-12 pr-4 py-4 text-2xl font-black text-center tracking-widest rounded-xl border-2 border-gray-300 focus:border-wm-blue outline-none transition"
                  style="letter-spacing: .35em;"
                />
              </div>
              <p class="text-xs text-gray-400 text-center">Enter your associate number to access the dashboard.</p>
            </div>

            <button
              type="submit"
              id="submitBtn"
              class="bg-wm-blue hover:bg-blue-700 active:bg-blue-800 text-white font-black py-4 rounded-xl transition shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-300 text-lg flex items-center justify-center gap-2"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
              </svg>
              Access MST Dashboard
            </button>
          </form>

          <!-- Tech link -->
          <p class="text-center text-xs text-gray-400">
            Technician? &rarr; <a href="/tech/login" class="text-wm-blue hover:underline font-bold">Tech Sign-In</a>
          </p>

        </div><!-- /card body -->
      </div><!-- /card -->

    </div>
  </main>

  <!-- ── FOOTER — identical to tech login ──────────────────────────────── -->
  <footer class="bg-wm-dark border-t border-blue-900 text-blue-400 text-center text-xs py-3">
    Shift Passdown Generator &bull; IND3 &bull; Walmart &copy; 2026
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function() {
      const btn = document.getElementById('submitBtn');
      btn.classList.add('btn-submitting');
      btn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg> Signing in…';
    });

    document.getElementById('pinInput').addEventListener('input', function() {
      this.value = this.value.replace(/\D/g, '');
    });

  </script>
</body>
</html>
